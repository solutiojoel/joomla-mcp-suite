<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joomla Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --bg2: #1a1d26;
      --bg3: #232636;
      --border: #2e3147;
      --accent: #6366f1;
      --accent2: #818cf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #64748b;
      --radius: 8px;
      --sidebar: 220px;
    }
    html, body, #root { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

    /* Layout */
    .layout { display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: var(--sidebar); background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Sidebar */
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
    .sidebar-logo { font-weight: 700; font-size: 15px; color: var(--accent2); display: flex; align-items: center; gap: 8px; }
    .sidebar-logo span { font-size: 20px; }
    .nav { flex: 1; padding: 8px 0; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; cursor: pointer; border-radius: 0; color: var(--text2); transition: all 0.15s; font-size: 13.5px; border-left: 2px solid transparent; }
    .nav-item:hover { background: var(--bg3); color: var(--text); }
    .nav-item.active { background: rgba(99,102,241,0.12); color: var(--accent2); border-left-color: var(--accent); }
    .nav-item-icon { width: 18px; text-align: center; }
    .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); }

    /* Site selector */
    .site-selector { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--bg3); border-radius: var(--radius); border: 1px solid var(--border); }
    .site-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
    .site-dot.inactive { background: var(--text3); }
    .site-url { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .site-change-btn { font-size: 11px; color: var(--accent2); cursor: pointer; white-space: nowrap; }
    .site-change-btn:hover { text-decoration: underline; }

    /* Header */
    .header { padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }
    .header-title { font-weight: 600; font-size: 16px; }
    .header-sub { font-size: 12px; color: var(--text3); }

    /* Content area */
    .content { flex: 1; overflow-y: auto; padding: 24px; }

    /* Cards */
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .card-title { font-weight: 600; font-size: 14px; margin-bottom: 12px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }

    /* Workflow cards */
    .wf-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: all 0.15s; }
    .wf-card:hover { border-color: var(--accent); background: var(--bg3); transform: translateY(-1px); }
    .wf-icon { font-size: 24px; margin-bottom: 8px; }
    .wf-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .wf-desc { font-size: 12px; color: var(--text2); }

    /* Forms */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
    .form-label .req { color: var(--error); margin-left: 2px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 8px 10px; font-size: 13px; font-family: inherit;
      transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-select option { background: var(--bg3); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent2); }
    .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent2); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* Step log */
    .step-log { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-family: 'Menlo', 'Consolas', monospace; font-size: 12px; max-height: 340px; overflow-y: auto; }
    .step-row { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); }
    .step-row:last-child { border-bottom: none; }
    .step-status { flex-shrink: 0; width: 16px; }
    .step-label { color: var(--text2); flex: 1; }
    .step-output { color: var(--text3); font-size: 11px; margin-top: 2px; }
    .status-pending  { color: var(--text3); }
    .status-running  { color: var(--warning); animation: pulse 1s infinite; }
    .status-done     { color: var(--success); }
    .status-error    { color: var(--error); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Tool explorer */
    .tool-list { max-height: 320px; overflow-y: auto; }
    .tool-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .tool-item:hover { background: var(--bg3); }
    .tool-item.selected { background: rgba(99,102,241,0.15); }
    .tool-name { font-size: 12px; font-family: monospace; color: var(--accent2); }
    .tool-desc { font-size: 11px; color: var(--text3); margin-top: 2px; }

    /* Site history */
    .history-text { font-family: 'Menlo', 'Consolas', monospace; font-size: 12px; white-space: pre-wrap; color: var(--text2); max-height: 600px; overflow-y: auto; line-height: 1.7; }

    /* Modal overlay */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
    .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 24px; }
    .modal-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
    .modal-sub { font-size: 12px; color: var(--text2); margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    /* Alerts */
    .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
    .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .alert-success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .alert-info { background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.3); color: var(--accent2); }

    /* Search input */
    .search-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 7px 10px; font-size: 13px; margin-bottom: 12px; }
    .search-input:focus { outline: none; border-color: var(--accent); }

    /* JSON editor */
    .json-editor { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #a5f3fc; padding: 10px; font-family: monospace; font-size: 12px; min-height: 120px; resize: vertical; }
    .json-editor:focus { outline: none; border-color: var(--accent); }

    /* Result output */
    .result-output { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: monospace; font-size: 12px; white-space: pre-wrap; color: var(--text2); max-height: 300px; overflow-y: auto; }

    /* Grid 2-col */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* Tag */
    .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .tag-purple { background: rgba(99,102,241,0.15); color: var(--accent2); }

    /* Spinner */
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .mt-4 { margin-top: 4px; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mb-12 { margin-bottom: 12px; }
    .flex { display: flex; }
    .flex-1 { flex: 1; }
    .gap-8 { gap: 8px; }
    .gap-12 { gap: 12px; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .text-muted { color: var(--text2); }
    .text-xs { font-size: 11px; }
    .font-mono { font-family: monospace; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef, useCallback } = React;
const h = React.createElement;

// ─── API helpers ──────────────────────────────────────────────────────────────

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  return res.json();
}

// ─── WebSocket hook ───────────────────────────────────────────────────────────

function useWS() {
  const ws = useRef(null);
  const handlers = useRef({});

  useEffect(() => {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const sock = new WebSocket(`${proto}://${location.host}/ws`);
    ws.current = sock;
    sock.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      const fn = handlers.current[msg.type];
      if (fn) fn(msg);
    };
    return () => sock.close();
  }, []);

  const send = useCallback((msg) => {
    if (ws.current && ws.current.readyState === WebSocket.OPEN) {
      ws.current.send(JSON.stringify(msg));
    }
  }, []);

  const on = useCallback((type, fn) => { handlers.current[type] = fn; }, []);

  return { send, on };
}

// ─── Site selector modal ──────────────────────────────────────────────────────

function SiteModal({ onClose, onSet }) {
  const [url, setUrl] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  async function handleSet() {
    if (!url.trim()) return;
    setLoading(true); setErr('');
    const res = await api('POST', '/api/sites/active', { url: url.trim() });
    setLoading(false);
    if (res.ok) { onSet(url.trim()); onClose(); }
    else setErr(res.error || 'Failed');
  }

  return h('div', { className: 'modal-bg', onClick: (e) => e.target === e.currentTarget && onClose() },
    h('div', { className: 'modal' },
      h('div', { className: 'modal-title' }, '🌐 Set Active Site'),
      h('div', { className: 'modal-sub' }, 'Enter the site URL to switch contexts'),
      err && h('div', { className: 'alert alert-error' }, err),
      h('div', { className: 'form-group' },
        h('label', { className: 'form-label' }, 'Site URL'),
        h('input', {
          className: 'form-input',
          value: url, onChange: e => setUrl(e.target.value),
          placeholder: 'https://example.com',
          onKeyDown: e => e.key === 'Enter' && handleSet(),
          autoFocus: true,
        })
      ),
      h('div', { className: 'modal-actions' },
        h('button', { className: 'btn btn-secondary', onClick: onClose }, 'Cancel'),
        h('button', { className: 'btn btn-primary', onClick: handleSet, disabled: loading || !url.trim() },
          loading ? h('span', { className: 'spinner' }) : null, 'Set Site'
        )
      )
    )
  );
}

// ─── Workflow runner modal ────────────────────────────────────────────────────

function WorkflowModal({ workflow, ws, onClose }) {
  const [inputs, setInputs] = useState({});
  const [steps, setSteps] = useState([]);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);
  const [finalErr, setFinalErr] = useState('');
  const logRef = useRef(null);

  // Init inputs with defaults
  useEffect(() => {
    const init = {};
    (workflow.inputs || []).forEach(inp => { init[inp.key] = inp.default || ''; });
    setInputs(init);
    // Init steps list from workflow definition
    setSteps((workflow.steps || []).map((s, i) => ({ index: i, label: s.label || s.tool, status: 'pending', text: '' })));
  }, [workflow]);

  // Auto-scroll log
  useEffect(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [steps]);

  function setInput(key, val) { setInputs(p => ({ ...p, [key]: val })); }

  function run() {
    setRunning(true); setDone(false); setFinalErr('');
    // Reset steps
    setSteps(prev => prev.map(s => ({ ...s, status: 'pending', text: '' })));

    ws.on('step_start', ({ index }) => {
      setSteps(prev => prev.map(s => s.index === index ? { ...s, status: 'running' } : s));
    });
    ws.on('step_done', ({ index, text, isError }) => {
      setSteps(prev => prev.map(s => s.index === index ? { ...s, status: isError ? 'error' : 'done', text } : s));
    });
    ws.on('step_error', ({ index, error }) => {
      setSteps(prev => prev.map(s => s.index === index ? { ...s, status: 'error', text: error } : s));
    });
    ws.on('workflow_done', () => { setRunning(false); setDone(true); });
    ws.on('workflow_error', ({ error }) => { setRunning(false); setFinalErr(error); });

    ws.send({ type: 'run_workflow', workflowId: workflow.id, inputs });
  }

  const icons = { pending: '○', running: '●', done: '✓', error: '✗' };

  return h('div', { className: 'modal-bg', onClick: e => !running && e.target === e.currentTarget && onClose() },
    h('div', { className: 'modal', style: { maxWidth: 640 } },
      h('div', { className: 'modal-title' }, workflow.icon + ' ' + workflow.name),
      h('div', { className: 'modal-sub' }, workflow.description),

      // Inputs
      !running && !done && h('div', null,
        (workflow.inputs || []).map(inp =>
          h('div', { key: inp.key, className: 'form-group' },
            h('label', { className: 'form-label' },
              inp.label, inp.required && h('span', { className: 'req' }, '*')
            ),
            inp.type === 'textarea'
              ? h('textarea', { className: 'form-textarea', value: inputs[inp.key] || '', onChange: e => setInput(inp.key, e.target.value), placeholder: inp.placeholder || '' })
              : inp.type === 'select' || inp.type === 'site_select'
              ? h('select', { className: 'form-select', value: inputs[inp.key] || '', onChange: e => setInput(inp.key, e.target.value) },
                  h('option', { value: '' }, '— select —'),
                  (inp.options || []).map(o => h('option', { key: o.value, value: o.value }, o.label))
                )
              : h('input', { className: 'form-input', type: 'text', value: inputs[inp.key] || '', onChange: e => setInput(inp.key, e.target.value), placeholder: inp.placeholder || '' })
          )
        )
      ),

      // Step log
      (running || done || finalErr) && h('div', { className: 'step-log mt-12', ref: logRef },
        steps.map(s =>
          h('div', { key: s.index, className: 'step-row' },
            h('span', { className: `step-status status-${s.status}` }, icons[s.status] || '?'),
            h('div', { style: { flex: 1 } },
              h('div', { className: 'step-label' }, s.label),
              s.text && h('div', { className: 'step-output' }, s.text.slice(0, 200) + (s.text.length > 200 ? '…' : ''))
            )
          )
        )
      ),

      done && h('div', { className: 'alert alert-success mt-12' }, '✓ Workflow completed successfully'),
      finalErr && h('div', { className: 'alert alert-error mt-12' }, '✗ ' + finalErr),

      h('div', { className: 'modal-actions' },
        h('button', { className: 'btn btn-secondary', onClick: onClose, disabled: running }, 'Close'),
        !done && !running && h('button', { className: 'btn btn-primary', onClick: run }, '▶ Run'),
        done && h('button', { className: 'btn btn-secondary', onClick: () => { setDone(false); setFinalErr(''); setSteps(prev => prev.map(s => ({...s, status:'pending', text:''}))); } }, '↺ Run Again')
      )
    )
  );
}

// ─── Views ────────────────────────────────────────────────────────────────────

function DashboardView({ activeSite, onNavigate }) {
  const [notes, setNotes] = useState('');
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (!activeSite) return;
    setLoading(true);
    api('GET', '/api/sites/notes').then(r => { setNotes(r.text || ''); setLoading(false); });
  }, [activeSite]);

  const recentLines = notes
    .split('\n')
    .filter(l => l.startsWith('### '))
    .slice(0, 5);

  return h('div', null,
    !activeSite && h('div', { className: 'alert alert-info mb-12' },
      '⚠ No active site set. Use the sidebar to select a site before running workflows.'
    ),
    h('div', { className: 'grid-2', style: { marginBottom: 16 } },
      h('div', { className: 'card' },
        h('div', { className: 'card-title' }, '⚡ Quick Actions'),
        h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } },
          ['Workflows', 'Tools', 'History'].map(v =>
            h('button', { key: v, className: 'btn btn-secondary btn-sm', onClick: () => onNavigate(v.toLowerCase()) }, v)
          )
        )
      ),
      h('div', { className: 'card' },
        h('div', { className: 'card-title' }, '🌐 Active Site'),
        activeSite
          ? h('div', { className: 'font-mono text-xs', style: { color: 'var(--accent2)' } }, activeSite)
          : h('div', { className: 'text-muted text-xs' }, 'None selected')
      )
    ),
    h('div', { className: 'card' },
      h('div', { className: 'card-title' }, '📋 Recent Changes'),
      loading ? h('div', { className: 'text-muted text-xs' }, 'Loading…')
        : recentLines.length
          ? h('div', null, recentLines.map((l, i) =>
              h('div', { key: i, style: { padding: '6px 0', borderBottom: '1px solid var(--border)', fontSize: 12, color: 'var(--text2)' } }, l)
            ))
          : h('div', { className: 'text-muted text-xs' }, 'No history found for this site.')
    )
  );
}

function WorkflowsView({ ws }) {
  const [workflows, setWorkflows] = useState([]);
  const [selected, setSelected] = useState(null);
  const [fullWf, setFullWf] = useState(null);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    api('GET', '/api/workflows').then(r => setWorkflows(r.workflows || []));
  }, []);

  async function open(wf) {
    setLoading(true);
    const res = await api('GET', `/api/workflows/${wf.id}`);
    setLoading(false);
    if (res.ok) { setFullWf(res.workflow); setSelected(wf); }
  }

  return h('div', null,
    h('div', { style: { marginBottom: 16, fontWeight: 600 } }, 'Choose a workflow to run:'),
    h('div', { className: 'card-grid' },
      workflows.map(wf =>
        h('div', { key: wf.id, className: 'wf-card', onClick: () => open(wf) },
          h('div', { className: 'wf-icon' }, wf.icon || '⚙'),
          h('div', { className: 'wf-name' }, wf.name),
          h('div', { className: 'wf-desc' }, wf.description)
        )
      ),
      loading && h('div', { className: 'wf-card', style: { display:'flex', alignItems:'center', justifyContent:'center' } },
        h('span', { className: 'spinner' })
      )
    ),
    fullWf && selected && h(WorkflowModal, {
      workflow: fullWf, ws,
      onClose: () => { setSelected(null); setFullWf(null); }
    })
  );
}

function ToolsView({ ws }) {
  const [tools, setTools] = useState([]);
  const [filter, setFilter] = useState('');
  const [selected, setSelected] = useState(null);
  const [argsText, setArgsText] = useState('{}');
  const [result, setResult] = useState(null);
  const [running, setRunning] = useState(false);

  useEffect(() => {
    api('GET', '/api/tools').then(r => setTools(r.tools || []));
  }, []);

  useEffect(() => {
    ws.on('tool_result', (msg) => { setResult(msg); setRunning(false); });
    ws.on('tool_error', (msg) => { setResult({ isError: true, text: msg.error }); setRunning(false); });
  }, [ws]);

  const filtered = tools.filter(t => t.name.toLowerCase().includes(filter.toLowerCase()));

  function selectTool(t) {
    setSelected(t);
    setResult(null);
    // Build skeleton args from schema
    const props = t.inputSchema?.properties || {};
    const skeleton = {};
    for (const [k, v] of Object.entries(props)) {
      skeleton[k] = v.type === 'boolean' ? false : v.type === 'number' ? 0 : '';
    }
    setArgsText(JSON.stringify(skeleton, null, 2));
  }

  function run() {
    let args;
    try { args = JSON.parse(argsText); } catch { setResult({ isError: true, text: 'Invalid JSON' }); return; }
    setRunning(true);
    ws.send({ type: 'call_tool', name: selected.name, args });
  }

  return h('div', { className: 'grid-2', style: { height: '100%' } },
    // Left: tool list
    h('div', { className: 'card', style: { overflow: 'hidden', display:'flex', flexDirection:'column' } },
      h('div', { className: 'card-title' }, 'Tool Explorer'),
      h('input', { className: 'search-input', placeholder: 'Filter tools…', value: filter, onChange: e => setFilter(e.target.value) }),
      h('div', { className: 'tool-list', style: { flex: 1 } },
        filtered.map(t =>
          h('div', { key: t.name, className: `tool-item ${selected?.name === t.name ? 'selected' : ''}`, onClick: () => selectTool(t) },
            h('div', null,
              h('div', { className: 'tool-name' }, t.name),
              h('div', { className: 'tool-desc' }, (t.description || '').slice(0, 70))
            )
          )
        )
      )
    ),
    // Right: tool runner
    h('div', { className: 'card', style: { overflow: 'hidden', display:'flex', flexDirection:'column' } },
      selected
        ? h('div', { style: { display:'flex', flexDirection:'column', height:'100%' } },
            h('div', { style: { display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom: 8 } },
              h('div', null,
                h('div', { className: 'font-mono', style: { color:'var(--accent2)', fontSize:13, fontWeight:600 } }, selected.name),
                h('div', { className: 'text-muted text-xs mt-4' }, selected.description || '')
              )
            ),
            h('label', { className: 'form-label mt-8' }, 'Arguments (JSON)'),
            h('textarea', { className: 'json-editor', value: argsText, onChange: e => setArgsText(e.target.value), style: { flex: 1 } }),
            h('div', { style: { display:'flex', gap: 8, marginTop: 8 } },
              h('button', { className: 'btn btn-primary', onClick: run, disabled: running },
                running ? h('span', { className: 'spinner' }) : null, 'Run'
              ),
              result && h('span', { className: `tag ${result.isError ? '' : 'tag-purple'}`, style: result.isError ? { background:'rgba(239,68,68,0.15)', color:'#fca5a5' } : {} },
                result.isError ? '✗ Error' : '✓ OK'
              )
            ),
            result && h('div', { className: 'result-output mt-8' }, result.text)
          )
        : h('div', { style: { display:'flex', alignItems:'center', justifyContent:'center', height:200, color:'var(--text3)', fontSize:13 } },
            '← Select a tool'
          )
    )
  );
}

function HistoryView() {
  const [notes, setNotes] = useState('');
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api('GET', '/api/sites/notes').then(r => { setNotes(r.text || 'No history found.'); setLoading(false); });
  }, []);

  return h('div', { className: 'card' },
    h('div', { className: 'card-title' }, '📋 Site History'),
    loading
      ? h('div', { className: 'text-muted text-xs' }, 'Loading…')
      : h('div', { className: 'history-text' }, notes)
  );
}

// ─── App root ─────────────────────────────────────────────────────────────────

function App() {
  const [view, setView] = useState('dashboard');
  const [activeSite, setActiveSite] = useState('');
  const [showSiteModal, setShowSiteModal] = useState(false);
  const ws = useWS();

  useEffect(() => {
    api('GET', '/api/sites/active').then(r => {
      const match = (r.text || '').match(/https?:\/\/[^\s]+/);
      if (match) setActiveSite(match[0]);
    });
  }, []);

  const navItems = [
    { id: 'dashboard', icon: '⊞', label: 'Dashboard' },
    { id: 'workflows', icon: '▶', label: 'Workflows' },
    { id: 'tools',     icon: '⚙', label: 'Tool Explorer' },
    { id: 'history',   icon: '📋', label: 'Site History' },
  ];

  const viewTitles = { dashboard: 'Dashboard', workflows: 'Workflows', tools: 'Tool Explorer', history: 'Site History' };

  return h('div', { className: 'layout' },
    // Sidebar
    h('div', { className: 'sidebar' },
      h('div', { className: 'sidebar-header' },
        h('div', { className: 'sidebar-logo' },
          h('span', null, '🧩'), 'Joomla Dashboard'
        )
      ),
      h('div', { className: 'nav' },
        navItems.map(n =>
          h('div', { key: n.id, className: `nav-item ${view === n.id ? 'active' : ''}`, onClick: () => setView(n.id) },
            h('span', { className: 'nav-item-icon' }, n.icon),
            n.label
          )
        )
      ),
      h('div', { className: 'sidebar-footer' },
        h('div', { className: 'text-xs text-muted', style: { marginBottom: 6 } }, 'Active Site'),
        h('div', { className: 'site-selector' },
          h('div', { className: `site-dot ${activeSite ? '' : 'inactive'}` }),
          h('div', { className: 'site-url' }, activeSite || 'None'),
          h('div', { className: 'site-change-btn', onClick: () => setShowSiteModal(true) }, 'Change')
        )
      )
    ),

    // Main
    h('div', { className: 'main' },
      h('div', { className: 'header' },
        h('div', null,
          h('div', { className: 'header-title' }, viewTitles[view] || view),
          activeSite && h('div', { className: 'header-sub' }, activeSite)
        )
      ),
      h('div', { className: 'content' },
        view === 'dashboard' && h(DashboardView, { activeSite, onNavigate: setView }),
        view === 'workflows' && h(WorkflowsView, { ws }),
        view === 'tools'     && h(ToolsView, { ws }),
        view === 'history'   && h(HistoryView)
      )
    ),

    showSiteModal && h(SiteModal, {
      onClose: () => setShowSiteModal(false),
      onSet: (url) => setActiveSite(url),
    })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
