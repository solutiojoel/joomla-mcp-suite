name: custom
title: Custom HTML
category: content

description: >
  Injects raw HTML directly into the page at the particle's position.
  Used for anything that doesn't fit a structured particle: welcome
  headings, inline JavaScript, module position wrappers via jdoc:include,
  admin footer links, popup containers, and decorative elements.

when_to_use:
  - Welcome/section heading text (h3 with a g-title class)
  - jdoc:include wrappers for module positions not covered by position particle
  - Admin footer icon (lock icon + "Site by Solutio" credit)
  - Popup overlay/container HTML
  - View All button links below content sections
  - Any one-off HTML that doesn't need dynamic content

when_not_to_use:
  - Dynamic article content (use contentarray)
  - Structured linked items (use blockcontent)
  - Standard module positions (use position particle — cleaner)

common_block_classes:
  welcome-title: Decorative welcome heading before a quicklinks row
  pop-up-block-2: Popup overlay container block
  news-button: Container for a standalone "View All" button
  adminfootericon: Admin footer with lock icon

attributes:
  html:
    type: html_string
    default: ""
    description: >
      Raw HTML content. Use standard Joomla tags where needed:
        <jdoc:include type="modules" name="{position}" />
      For headings: <h3 class="g-title">Text here</h3>
      For buttons:  <a href="/path" class="button">Label</a>
      Keep HTML minimal — avoid inline styles where CSS can handle it.

  enabled:
    type: integer
    default: 1
    description: 1 to show, 0 to hide.

rendered_html:
  outer_wrapper: "div.g-block.{blockClass}"
  inner_wrapper: "div.g-content"
  particle_element: "div.g-custom"

examples:
  welcome_heading:
    description: Welcome heading before the quicklinks bar
    blockClass: welcome-title
    attributes:
      html: '<h3 class="g-title">Welcome to {PARISH_NAME}</h3>'
      enabled: 1

  view_all_button:
    description: Standalone "View All News" link below a news feed
    blockClass: news-button
    attributes:
      html: '<a href="/news" class="button">View All News</a>'
      enabled: 1

  admin_footer:
    description: Admin lock icon + Solutio credit in copyright section
    blockClass: ""
    attributes:
      html: |
        <div class="adminfootericon" style="font-size: x-small; line-height: 1.3; text-shadow: 2px 2px #000000;">
          <a style="font-size: large;" href="/administrator/" target="_blank">
            <i class="fa fa-lock"></i></a>
          <br><br>
          <a style="color: #ffffff;" href="http://solutiosoftware.com/" target="_blank">Site by Solutio</a>
          <br>
          <a style="color: #ffffff;" href="https://solutiosoftware.com/web-policy" target="_blank" rel="noopener noreferrer">Analytics Privacy Policy</a>
        </div>
      enabled: 1

  popup_overlay:
    description: Pop-up container with close button
    blockClass: pop-up-block-2
    attributes:
      html: |
        <div id="pop-up-overlay-2"></div>
        <div id="pop-up-container-2">
          <div id="popup-2">
            <jdoc:include type="modules" name="pop-up" />
          </div>
          <button id="close-popup-button-2"><i class="fas fa-times-circle"></i></button>
        </div>
      enabled: 1

  subsite_navigation:
    description: Subsite navigation module wrapper
    attributes:
      html: '<div class="ql-toplinks-studius"><jdoc:include type="modules" name="subsite-navigation" /></div>'
      enabled: 1
