design_notes: |
  Cemetery site - very different from parish sites. No mass schedule, no events.
  Custom containers: association, choose, connected, info, welcome, translate.
  2-column grid with box shadows for cemetery section showcase.
  Swiper hero with QL overlay. Linksources widget. Translation container.
  Also has multiple sub-cemetery home outlines (#Good Shepherd, #Holy Cross, #TBD).
