# Section Template: Header Navigation
# Usage: Navigation section — logo, toplinks, main menu
# Place in: Base Outline, navigation section
# Use with: gantry_section_apply on the BASE OUTLINE (not #Home)
#
# INHERITANCE RULE: Navigation belongs in the Base Outline only.
# All sub-outlines (#Home, sub-pages) inherit it. Do not duplicate.

id: navigation
type: section
attributes:
  class: "ole-faithful stock"

grids:
  # Row 1 (mobile only): mobile logo
  - blocks:
      - size: 100
        blockClass: show-mobile
        particle: logo
        title: "Mobile Logo"

  # Row 2 (desktop): logo | spacer | toplinks
  - blocks:
      - size: 65
        blockClass: hidden-phone
        particle: logo
        title: "Logo / Image"
      - size: 10
        particle: spacer
        title: "Spacer"
      - size: 25
        blockClass: ql-toplinks-studius
        particle: blockcontent
        title: "Toplinks"
        attributes:
          source: particle
          title: ""
          subcontents:
            - name: "Mass Times"
              button: "Mass Times"
              buttonlink: "/mass-times"
              buttontarget: "_self"
              accent: none
              class: ""
              icon: ""
              img: ""
              subtitle: ""
              description: ""
              buttonclass: ""
              rokboximage: ""
              rokboxcaption: ""
            - name: "Contact Us"
              button: "Contact Us"
              buttonlink: "/contact-us"
              buttontarget: "_self"
              accent: none
              class: ""
              icon: ""
              img: ""
              subtitle: ""
              description: ""
              buttonclass: ""
              rokboximage: ""
              rokboxcaption: ""

  # Row 3: full-width main menu
  - blocks:
      - size: 100
        particle: menu
        title: "Navigation Menu"
        attributes:
          showTitle: 0
          layout: horizontal
          startLevel: 1
          endLevel: 0
          showAllChildren: 1
          activeClass: active
          highlightClass: active
          activeDropdownClass: active
