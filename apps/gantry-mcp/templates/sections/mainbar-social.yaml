# Section Template: Social Widget Mainbar
# Usage: Facebook or Instagram embed in the mainbar section
# Place in: container-main > mainbar
#
# REQUIRED CONTEXT VARIABLES:
#   {{social_article_id}} — Joomla article ID for the social widget shell article

id: mainbar
type: section
attributes:
  class: "news-to-me headlines-spacing"

grids:
  - blocks:
      - size: 100
        blockClass: facebook-widget-container widget-container
        particle: contentarray
        title: "Social Feed"
        attributes:
          article:
            filter:
              categories: ""
              articles: "{{social_article_id}}"
              featured: include
            limit:
              total: "1"
              columns: "1"
            display:
              pagination_buttons: ""
            sort:
              orderby: ordering
              ordering: ASC
