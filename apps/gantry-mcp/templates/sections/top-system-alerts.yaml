# Section Template: Top Section — System Messages + Alert Banner
# Usage: Complete top section: system messages (required) + alert contentarray
# Place in: #Home or any sub-outline, top section
# Use with: gantry_section_apply, mode: replace
#
# REQUIRED CONTEXT VARIABLES:
#   {{alert_category_id}} — Joomla category ID for alert articles
#
# NOTE: system/messages is REQUIRED in every outline's top section.
# It renders Joomla flash messages (login errors, form confirmations, etc.)

id: top
type: section

grids:
  - blocks:
      - size: 100
        particle: system/messages
        title: "System Messages"
  - blocks:
      - size: 100
        blockClass: modern-alert
        particle: contentarray
        title: "Alert"
        attributes:
          article:
            filter:
              categories: "{{alert_category_id}}"
              articles: ""
              featured: include
            limit:
              total: "10"
              columns: "1"
              start: "0"
            display:
              pagination_buttons: ""
              title: { enabled: "show" }
            sort:
              orderby: ordering
              ordering: ASC
