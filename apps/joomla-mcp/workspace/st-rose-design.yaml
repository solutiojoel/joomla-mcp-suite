main_container:
  layout: sidebar-main-aside
  sidebar:
    section_id: sidebar
    type: section
    size: 100
    grids:
      - blocks:
          - size: 100
            particle: contentarray
            blockClass: ph-titlestack
            title: Parish News
            attributes:
              article:
                filter:
                  categories: '8'
                  articles: ''
                  featured: include
                limit:
                  total: '3'
                  columns: '1'
                  start: '0'
                display:
                  pagination_buttons: ''
                  title:
                    enabled: ''
                  read_more:
                    enabled: show
                  image:
                    enabled: full
                sort:
                  orderby: ordering
                  ordering: ASC
  mainbar:
    section_id: mainbar
    type: section
    size: 100
    grids:
      - blocks:
