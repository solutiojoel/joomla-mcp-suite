top_container:
  sections:
    - id: slideshow
      type: section
      grids:
        - blocks:
            - size: 70
              particle: swiper
              blockClass: fullwidth-swiper rotate-addpic
              title: Rotator
              attributes:
                source: joomla
                image: img
                height: 36vw
                heightMobile: 56vw
                nav: enabled
                pagination: bullets
                autoplay: enabled
                autoplayTimeout: '8000'
                loop: enabled
                speed: '800'
                slides_linkable: disabled
                touchmove: enabled
                direction: horizontal
                effect: slide
                items: []
                article:
                  filter:
                    categories: '10'
                    articles: ''
                    featured: include
                  limit:
                    total: '10'
                    columns: '1'
                    start: '0'
                  sort:
                    orderby: ordering
                    ordering: ASC
            - size: 30
              particle: contentarray
              blockClass: mass-times-block
              title: Mass Times
              attributes:
                article:
                  filter:
                    categories: ''
                    articles: '55'
                    featured: include
                  limit:
                    total: '1'
                    columns: '1'
                    start: '0'
                  display:
                    pagination_buttons: ''
                    title:
                      enabled: ''
                  sort:
                    orderby: ordering
                    ordering: ASC
      attributes:
        class: floatator slideshow-spacing
