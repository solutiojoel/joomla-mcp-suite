<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 290px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #1e1b4b;
      background: #fafafa;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #4f46e5;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge.ok    { background: #d1fae5; color: #065f46; }
    .badge.error { background: #fee2e2; color: #991b1b; }
    .badge.checking { background: #e0e7ff; color: #3730a3; }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .status-label { color: #374151; }

    .last-capture {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      color: #6b7280;
      font-size: 12px;
      min-height: 36px;
    }

    .last-capture strong { color: #1e1b4b; font-family: monospace; font-size: 11px; }

    .hint {
      color: #6b7280;
      line-height: 1.5;
      font-size: 12px;
    }

    .hint kbd {
      display: inline-block;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 3px;
      padding: 0 4px;
      font-size: 11px;
      font-family: monospace;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.ok    { background: #10b981; }
    .dot.error { background: #ef4444; }
    .dot.checking { background: #6366f1; animation: pulse 1s infinite; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  </style>
</head>
<body>
  <header>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <rect width="20" height="20" rx="5" fill="#6366f1"/>
      <path d="M5 10h10M10 5v10" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>Claude CDP Inspector</h1>
  </header>

  <div class="status-row">
    <span class="status-label">MCP bridge</span>
    <span class="badge checking" id="bridge-badge">
      <span class="dot checking" id="bridge-dot"></span>&nbsp;Checking…
    </span>
  </div>

  <div class="last-capture" id="last-capture">No element captured yet.</div>

  <p class="hint">
    Right-click any element → <kbd>Inspect with Claude</kbd>.<br>
    The MCP server must be running (bridge on port 9224).
  </p>

  <script src="popup.js"></script>
</body>
</html>
